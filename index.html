<!DOCTYPE html>
<html>
<head>
    <title>StudentNotes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>StudentNotes</h1>
    <p>Your academic notes hub</p>
</header>


<nav>
    <button>Home</button>
    <button>Notes</button>
    <button>Login</button>
</nav>


<section class="hero">
    <h2>Find Your Course Notes</h2>
    <p>Access notes from First Year to Fourth Year</p>

    <input type="text" placeholder="Search notes...">
</section>


<section class="years">

<h2>Choose Your Year</h2>

<div class="cards">

<div class="card">
<h3>First Year</h3>
<p>View notes</p>
</div>

<div class="card">
<h3>Second Year</h3>
<p>View notes</p>
</div>

<div class="card">
<h3>Third Year</h3>
<p>View notes</p>
</div>

<div class="card">
<h3>Fourth Year</h3>
<p>View notes</p>
</div>

</div>

</section>


<script src="app.js"></script>

</body>
</html>
